<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Extract</title>
<meta name="description" content="Turn recipe links into clean recipes you can save, plan, shop for and cook from. Free, and works offline.">
<meta name="theme-color" content="#26231F" media="(prefers-color-scheme: light)" id="tc-light">
<meta name="theme-color" content="#1C1A17" media="(prefers-color-scheme: dark)" id="tc-dark">
<script>
  /* Theme picked in Settings (light, dark, or follow the phone). Set before the page draws so it never flashes. */
  (function () {
    var t = "", ts = ""; try { t = localStorage.getItem("rk-theme") || ""; ts = localStorage.getItem("rk-textSize") || ""; } catch (e) {}
    if (ts === "lg" || ts === "xl") document.documentElement.setAttribute("data-text", ts);
    if (t === "light" || t === "dark") {
      document.documentElement.setAttribute("data-theme", t);
      var c = t === "light" ? "#26231F" : "#1C1A17";
      document.getElementById("tc-light").content = c; document.getElementById("tc-dark").content = c;
    }
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Extract">
<link rel="manifest" href="/manifest.webmanifest" id="manifest-link">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icons/icon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" id="touch-icon">
<script>
  /* Fit to this phone's screen. The first time the home-screen app opens, it measures how much room the
     swipe bar at the bottom needs and saves it. Every launch after that uses the saved size, so the bottom
     buttons sit in the same place each time. A new install (or a different phone) measures again. */
  (function () {
    var root = document.documentElement;
    var standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
    if (!standalone || !matchMedia("(pointer: coarse)").matches) return;
    var key = Math.min(screen.width, screen.height) + "x" + Math.max(screen.width, screen.height);
    var fit = null; try { fit = JSON.parse(localStorage.getItem("rk-fit") || "null"); } catch (e) {}
    function apply(f) { root.style.setProperty("--fit-b", f.bottom + "px"); root.classList.add("fitted"); }
    if (fit && fit.v === 3 && fit.key === key && typeof fit.bottom === "number") return apply(fit);
    function measure() {
      var probe = document.createElement("div");
      probe.style.cssText = "position:fixed;left:0;top:0;width:0;visibility:hidden;pointer-events:none;padding-bottom:env(safe-area-inset-bottom,0px)";
      document.body.appendChild(probe);
      var inset = parseFloat(getComputedStyle(probe).paddingBottom) || 0;
      probe.remove();
      // Phones with a swipe bar instead of a home button are at least 812pt tall. Apple's full 34pt
      // leaves the buttons floating, and 0 puts them on the swipe bar; about a third sits them just above it.
      // iOS sometimes reports 0 here on first launch, so fall back to the phone's size.
      var iphoneBar = /iP(hone|od)/.test(navigator.userAgent) && Math.max(screen.width, screen.height) >= 812 ? 34 : 0;
      var f = { v: 3, key: key, bottom: Math.round(Math.max(inset, iphoneBar) * 0.3) };
      try { localStorage.setItem("rk-fit", JSON.stringify(f)); } catch (e) {}
      apply(f);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { requestAnimationFrame(measure); });
    else requestAnimationFrame(measure);
  })();
</script>
<script>
  /* Home-screen icon: the phone reads these when Extract is added to the home screen.
     "Match my phone" picks light or dark from the phone's mode at that moment. */
  (function () {
    var pick = ""; try { pick = localStorage.getItem("rk-iconStyle") || ""; } catch (e) {}
    var light = pick === "light" || (!pick && matchMedia("(prefers-color-scheme: light)").matches);
    if (light) {
      document.getElementById("touch-icon").href = "/icons/apple-touch-icon-light.png";
      document.getElementById("manifest-link").href = "/manifest-light.webmanifest";
    }
  })();
</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400&display=swap">

      Extract
    </button>
    <button class="add-btn" data-act="nav" data-v="add" id="nav-add" aria-label="Add Recipe">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add Recipe</span>
    </button>
  </div>
  <div class="offline" id="offline" role="status" hidden>Offline. Your recipes, cooking, plan, groceries and pantry all still work. Importing needs internet.</div>
</header>
<nav class="tabbar" aria-label="Main">
  <button data-act="nav" data-v="library" id="nav-library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h9.5a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h9.5"/><path d="M9 8h5"/></svg>Recipes</button>
  <button data-act="nav" data-v="plan" id="nav-plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-act="nav" data-v="list" id="nav-list"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8h13l-1.2 11a1.5 1.5 0 0 1-1.5 1.3H8.2a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg><span class="badge" id="list-badge" hidden></span></span>Groceries</button>
  <button data-act="nav" data-v="pantry" id="nav-pantry"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h10v3H7z"/><path d="M6.5 6.5h11v13a1.5 1.5 0 0 1-1.5 1.5H8a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M6.5 11h11"/></svg>Pantry</button>
  <button data-act="nav" data-v="more" id="nav-more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></svg>More</button>
</nav>
<main class="wrap" id="main" aria-live="polite">
  <p class="status"><span class="spin"></span> Opening your recipes…</p>
</main>
<div id="timers" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="tour-root"></div>
<div id="toast" class="toast" hidden></div>
<script src="/app.js" type="module"></script>

</html>
